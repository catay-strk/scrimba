<!DOCTYPE html>
<html>
    <head>
        <title>Design system</title>

        <!-- Google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Bellefair&family=Barlow:wght@400;700&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        
        <div class="container">
            <h1 class="uppercase">Design system</h1>
            
            <section id="colors" style="margin: 4rem 0;">
                <h2 class="uppercase fs-500 ff-sans-cond"><span class="text-accent">01</span> colors</h2>
                <div class="flex">
                    <div style="flex-grow: 1;">
                        <div >
                            <div class="text-white bg-dark ff-serif fs-500" style="padding: 3rem 1rem 1rem; border: 1px solid white">
                                #0B0D17
                            </div>
                            <p><span class="text-accent">RGB</span> 11, 13, 23</p>
                            <p><span class="text-accent">HSL</span> 230°, 35%, 7%</p>
                        </div>
                    </div>
                    <div style="flex-grow: 1;">
                        <div>
                            <div class="bg-light text-dark ff-serif fs-500" style="padding: 3rem 1rem 1rem; border: 1px solid white">
                                #D0D6F9
                            </div>
                            <p><span class="text-accent">RGB</span> 11, 13, 23</p>
                            <p><span class="text-accent">HSL</span> 230°, 35%, 7%</p>
                        </div>
                    </div>
                    <div style="flex-grow: 1;">
                        <div>
                            <div class="bg-white text-dark ff-serif fs-500" style="padding: 3rem 1rem 1rem; border: 1px solid white">
                                #FFFFFF
                            </div>
                            <p><span class="text-accent">RGB</span> 11, 13, 23</p>
                            <p><span class="text-accent">HSL</span> 230°, 35%, 7%</p>
                        </div>
                    </div>
                </div>
                
            </section>

            
        </div>
        
        <script src="index.pack.js"></script>
    </body>
</html>
