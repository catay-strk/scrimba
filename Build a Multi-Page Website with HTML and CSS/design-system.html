<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <title>Design system</title>
    </head>
    <body class="bg-dark text-white">
        
        <div class="container">
            <h1>Design system</h1>
            
            <section id="colors">
                <h2><span>01</span> colors</h2>
                <div class="flex">
                    <div style="flex-grow: 1;">
                        <div class="text-white bg-dark">
                            <div style="padding: 3rem 1rem 1rem; border: 1px solid white">
                                #0B0D17
                            </div>
                            <p><span class="text-accent">RGB</span> 11, 13, 23</p>
                            <p><span class="text-accent">HSL</span> 230°, 35%, 7%</p>
                        </div>
                    </div>
                    <div style="flex-grow: 1;">
                        <div>
                            <div class="bg-light text-dark" style="padding: 3rem 1rem 1rem; border: 1px solid white">
                                #D0D6F9
                            </div>
                            <p><span class="text-accent">RGB</span> 11, 13, 23</p>
                            <p><span class="text-accent">HSL</span> 230°, 35%, 7%</p>
                        </div>
                    </div>
                    <div style="flex-grow: 1;">
                        <div>
                            <div class="bg-white text-dark" style="padding: 3rem 1rem 1rem; border: 1px solid white">
                                #FFFFFF
                            </div>
                            <p><span class="text-accent">RGB</span> 11, 13, 23</p>
                            <p><span class="text-accent">HSL</span> 230°, 35%, 7%</p>
                        </div>
                    </div>
                </div>
                
            </section>
        </div>
        
        <script src="index.pack.js"></script>
